# GitLab CI for zacl: load, serve, fetch and run zacl-tests on each Lisp
# zacl supports, in the Common Lisp Foundation's implementation images
# (gitlab.common-lisp.net/cl-docker-images, clfoundation/* on Docker Hub).
#
# One deps job fetches what every test job needs -- zaserve, the
# Quicklisp dist releases zacl and the tests depend on, and for EGCL the
# Evergreen library forks (ci/egcl-forks.txt) -- into deps/, an
# artifact; the test jobs then load everything with plain ASDF
# (ci/run-tests.lisp), one job per implementation, in parallel.  The
# instance's docker runner serves every job.
#
# dotcl is not here yet: its zacl needs the patched CFFI of the dotcl
# Quicklisp dist (https://dotcl.github.io/dist/dotcl.txt), which this
# ASDF-only layout does not fetch.

stages:
  - deps
  - test

variables:
  GIT_DEPTH: "1"
  ZASERVE_REPO: "https://gitlab.common-lisp.net/dcooper/zaserve.git"
  ZASERVE_REF: "master"

deps:
  stage: deps
  image: clfoundation/sbcl:2.6.9-trixie-slim
  script:
    - apt-get -qq update && apt-get -qq -y install --no-install-recommends git curl ca-certificates patch > /dev/null
    - mkdir -p deps
    - git clone -q --depth 1 -b "$ZASERVE_REF" "$ZASERVE_REPO" deps/zaserve
    - curl -fsSLo deps/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
    - sbcl --noinform --non-interactive --load ci/fetch-deps.lisp
    - sh ci/fetch-egcl-forks.sh
    # cl-store does not know EGCL (its system definition refuses to load);
    # ci/cl-store-egcl.patch teaches it, for the EGCL job only
    - patch -p1 -d deps/quicklisp/dists/quicklisp/software/cl-store-*/ < ci/cl-store-egcl.patch
  artifacts:
    paths:
      - deps/zaserve/
      - deps/quicklisp/dists/quicklisp/software/
      - deps/forks/
      - deps/extra/
    expire_in: 1 day

.test:
  stage: test
  needs: ["deps"]

test-sbcl:
  extends: .test
  image: clfoundation/sbcl:2.6.9-trixie-slim
  script:
    - sbcl --noinform --non-interactive --load ci/run-tests.lisp

test-ccl:
  extends: .test
  image: clfoundation/ccl:1.13.1-rc-trixie-slim
  script:
    - ccl -n -b -l ci/run-tests.lisp

# The full ECL image, not the slim one: the slim image's ECL is built
# without DFFI (no :dffi feature), and CFFI needs it to open a foreign
# library at run time -- cl+ssl's libcrypto -- so zacl cannot load there.
test-ecl:
  extends: .test
  image: clfoundation/ecl:26.5.5-trixie
  script:
    - ecl --norc --load ci/run-tests.lisp

# The gnu-slim variant: a dynamically linked glibc EGCL with the C FFI,
# which cl+ssl needs; the static musl executable of the other tags
# cannot dlopen libcrypto.  The youngest port, so a failure here does
# not fail the pipeline: as of 2026-10-27 it serves and passes 24 of
# the 25 tests (chunking-round-trip writes octets into a character
# stream there).
test-egcl:
  extends: .test
  image: clfoundation/egcl:0.0.10-trixie-gnu-slim
  allow_failure: true
  script:
    - egcl --no-init --load ci/run-tests.lisp
